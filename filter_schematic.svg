<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" font-family="monospace" font-size="14">
  <!-- Background -->
  <rect width="600" height="300" fill="white"/>

  <!-- Pin 17 label -->
  <text x="20" y="80" font-weight="bold" fill="#333">Pin 17</text>
  <text x="20" y="96" fill="#666">(GPIO0)</text>

  <!-- Wire from Pin 17 to Resistor -->
  <line x1="90" y1="75" x2="150" y2="75" stroke="black" stroke-width="2"/>

  <!-- Resistor (1k ohm) -->
  <rect x="150" y="65" width="80" height="20" fill="none" stroke="black" stroke-width="2"/>
  <text x="165" y="58" fill="#333" font-size="13">1kOhm</text>

  <!-- Wire from Resistor to junction -->
  <line x1="230" y1="75" x2="310" y2="75" stroke="black" stroke-width="2"/>

  <!-- Junction dot -->
  <circle cx="310" cy="75" r="4" fill="black"/>

  <!-- Wire from junction to Speaker -->
  <line x1="310" y1="75" x2="400" y2="75" stroke="black" stroke-width="2"/>

  <!-- Speaker symbol -->
  <rect x="400" y="55" width="30" height="40" fill="none" stroke="black" stroke-width="2"/>
  <polygon points="430,45 470,25 470,105 430,95" fill="none" stroke="black" stroke-width="2"/>
  <text x="410" y="125" fill="#333" font-size="12">Speaker</text>

  <!-- Wire from Speaker to GND right -->
  <line x1="470" y1="65" x2="520" y2="65" stroke="black" stroke-width="2"/>
  <line x1="520" y1="65" x2="520" y2="240" stroke="black" stroke-width="2"/>

  <!-- Capacitor from junction down -->
  <line x1="310" y1="75" x2="310" y2="150" stroke="black" stroke-width="2"/>

  <!-- Capacitor plates -->
  <line x1="290" y1="150" x2="330" y2="150" stroke="black" stroke-width="3"/>
  <line x1="290" y1="165" x2="330" y2="165" stroke="black" stroke-width="3"/>
  <text x="340" y="162" fill="#333" font-size="13">22nF</text>

  <!-- Wire from Capacitor to GND -->
  <line x1="310" y1="165" x2="310" y2="240" stroke="black" stroke-width="2"/>

  <!-- GND bus -->
  <line x1="310" y1="240" x2="520" y2="240" stroke="black" stroke-width="2"/>

  <!-- GND symbol -->
  <line x1="400" y1="240" x2="400" y2="255" stroke="black" stroke-width="2"/>
  <line x1="380" y1="255" x2="420" y2="255" stroke="black" stroke-width="2"/>
  <line x1="387" y1="262" x2="413" y2="262" stroke="black" stroke-width="2"/>
  <line x1="394" y1="269" x2="406" y2="269" stroke="black" stroke-width="2"/>
  <text x="370" y="290" font-weight="bold" fill="#333">Pin 5 (GND)</text>

  <!-- Title -->
  <text x="180" y="20" font-size="16" font-weight="bold" fill="#333">PDM Low-Pass Filter (RC ~7.2kHz)</text>
</svg>
