<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="monospace" font-size="13">
  <rect width="900" height="450" fill="white"/>

  <!-- Title -->
  <text x="250" y="25" font-size="16" font-weight="bold" fill="#333">Kompletter Schaltplan: TI-Nspire UART Audio Player</text>

  <!-- ==================== -->
  <!-- LEFT: TI-Nspire Pins -->
  <!-- ==================== -->
  <rect x="20" y="155" width="80" height="90" rx="5" fill="#f0f0f0" stroke="black" stroke-width="2"/>
  <text x="28" y="180" fill="#333" font-size="11" font-weight="bold">TI-Nspire</text>
  <text x="35" y="198" fill="#333" font-size="11">Pin 4</text>
  <text x="40" y="212" fill="#666" font-size="10">(Tx)</text>
  <text x="35" y="235" fill="#333" font-size="11">Pin 5</text>
  <text x="35" y="249" fill="#666" font-size="10">(GND)</text>

  <!-- Pin 4 wire out -->
  <line x1="100" y1="195" x2="150" y2="195" stroke="black" stroke-width="2"/>
  <!-- Pin 5 wire down to GND bus -->
  <line x1="100" y1="238" x2="120" y2="238" stroke="black" stroke-width="2"/>
  <line x1="120" y1="238" x2="120" y2="380" stroke="black" stroke-width="2"/>

  <!-- ==================== -->
  <!-- RC FILTER STAGE 1    -->
  <!-- ==================== -->
  <text x="165" y="145" font-size="11" fill="#888">Stufe 1</text>

  <!-- R1 -->
  <rect x="150" y="185" width="60" height="20" fill="none" stroke="black" stroke-width="2"/>
  <text x="160" y="178" fill="#333" font-size="12">1kOhm</text>

  <!-- Wire R1 to junction A -->
  <line x1="210" y1="195" x2="250" y2="195" stroke="black" stroke-width="2"/>
  <circle cx="250" cy="195" r="4" fill="black"/>

  <!-- C1 down from junction A -->
  <line x1="250" y1="195" x2="250" y2="270" stroke="black" stroke-width="2"/>
  <line x1="235" y1="270" x2="265" y2="270" stroke="black" stroke-width="3"/>
  <line x1="235" y1="280" x2="265" y2="280" stroke="black" stroke-width="3"/>
  <text x="270" y="279" fill="#333" font-size="11">100nF</text>
  <line x1="250" y1="280" x2="250" y2="380" stroke="black" stroke-width="2"/>

  <!-- ==================== -->
  <!-- RC FILTER STAGE 2    -->
  <!-- ==================== -->
  <text x="315" y="145" font-size="11" fill="#888">Stufe 2</text>

  <!-- Wire junction A to R2 -->
  <line x1="250" y1="195" x2="300" y2="195" stroke="black" stroke-width="2"/>

  <!-- R2 -->
  <rect x="300" y="185" width="60" height="20" fill="none" stroke="black" stroke-width="2"/>
  <text x="310" y="178" fill="#333" font-size="12">1kOhm</text>

  <!-- Wire R2 to junction B -->
  <line x1="360" y1="195" x2="400" y2="195" stroke="black" stroke-width="2"/>
  <circle cx="400" cy="195" r="4" fill="black"/>

  <!-- C2 down from junction B -->
  <line x1="400" y1="195" x2="400" y2="270" stroke="black" stroke-width="2"/>
  <line x1="385" y1="270" x2="415" y2="270" stroke="black" stroke-width="3"/>
  <line x1="385" y1="280" x2="415" y2="280" stroke="black" stroke-width="3"/>
  <text x="420" y="279" fill="#333" font-size="11">100nF</text>
  <line x1="400" y1="280" x2="400" y2="380" stroke="black" stroke-width="2"/>

  <!-- ================================= -->
  <!-- TRANSISTOR (Common Emitter)       -->
  <!-- ================================= -->
  <text x="510" y="145" font-size="11" fill="#888">Verstaerker</text>

  <!-- ==================== -->
  <!-- RC FILTER STAGE 3    -->
  <!-- ==================== -->
  <text x="445" y="145" font-size="11" fill="#888">Stufe 3</text>

  <!-- Wire junction B to junction C -->
  <line x1="400" y1="195" x2="470" y2="195" stroke="black" stroke-width="2"/>
  <circle cx="470" cy="195" r="4" fill="black"/>

  <!-- C3 down from junction C (moved from collector) -->
  <line x1="470" y1="195" x2="470" y2="270" stroke="black" stroke-width="2"/>
  <line x1="455" y1="270" x2="485" y2="270" stroke="black" stroke-width="3"/>
  <line x1="455" y1="280" x2="485" y2="280" stroke="black" stroke-width="3"/>
  <text x="490" y="279" fill="#333" font-size="11">100nF</text>
  <line x1="470" y1="280" x2="470" y2="380" stroke="black" stroke-width="2"/>

  <!-- Wire junction C to Base -->
  <line x1="470" y1="195" x2="520" y2="195" stroke="black" stroke-width="2"/>

  <!-- Transistor symbol -->
  <line x1="520" y1="195" x2="545" y2="195" stroke="black" stroke-width="2"/>
  <line x1="545" y1="160" x2="545" y2="230" stroke="black" stroke-width="3"/>
  <!-- Collector line (up-right) -->
  <line x1="545" y1="170" x2="580" y2="135" stroke="black" stroke-width="2"/>
  <!-- Emitter line (down-right) -->
  <line x1="545" y1="220" x2="580" y2="255" stroke="black" stroke-width="2"/>
  <!-- Arrow on emitter -->
  <polygon points="580,255 568,244 572,256" fill="black"/>

  <!-- Pin labels on transistor -->
  <text x="510" y="190" fill="#009900" font-size="12" font-weight="bold">B</text>
  <text x="585" y="133" fill="#cc0000" font-size="12" font-weight="bold">C</text>
  <text x="585" y="263" fill="#0066cc" font-size="12" font-weight="bold">E</text>

  <!-- S8050 label -->
  <text x="548" y="200" fill="#333" font-size="11">S8050</text>

  <!-- Pinout reminder -->
  <rect x="490" y="230" width="115" height="45" rx="3" fill="#fffff0" stroke="#ccc" stroke-width="1"/>
  <text x="497" y="247" fill="#666" font-size="10">flache Seite:</text>
  <text x="497" y="265" fill="#666" font-size="11">E(L) B(M) C(R)</text>

  <!-- =============================== -->
  <!-- EMITTER → GND                   -->
  <!-- =============================== -->
  <line x1="580" y1="255" x2="580" y2="380" stroke="#0066cc" stroke-width="2"/>

  <!-- =============================== -->
  <!-- COLLECTOR → 10Ω → Speaker → 5V  -->
  <!-- =============================== -->

  <!-- Collector up -->
  <line x1="580" y1="135" x2="580" y2="115" stroke="#cc0000" stroke-width="2"/>

  <!-- 10Ω up from collector -->
  <line x1="580" y1="115" x2="580" y2="95" stroke="#cc0000" stroke-width="2"/>
  <rect x="555" y="70" width="50" height="20" fill="none" stroke="#cc0000" stroke-width="2"/>
  <text x="560" y="65" fill="#cc0000" font-size="12">10 Ohm</text>
  <line x1="580" y1="70" x2="580" y2="55" stroke="#cc0000" stroke-width="2"/>

  <!-- Wire to speaker -->
  <line x1="580" y1="55" x2="700" y2="55" stroke="#cc0000" stroke-width="2"/>

  <!-- Speaker -->
  <rect x="700" y="40" width="30" height="30" fill="none" stroke="#cc0000" stroke-width="2"/>
  <polygon points="730,32 760,18 760,88 730,74" fill="none" stroke="#cc0000" stroke-width="2"/>
  <text x="700" y="105" fill="#cc0000" font-size="12">Speaker</text>
  <text x="700" y="120" fill="#cc0000" font-size="11">32Ohm 0.5W</text>

  <!-- Speaker to 5V -->
  <line x1="760" y1="55" x2="830" y2="55" stroke="#cc0000" stroke-width="2"/>

  <!-- 5V label -->
  <line x1="830" y1="55" x2="830" y2="42" stroke="#cc0000" stroke-width="2"/>
  <line x1="818" y1="42" x2="842" y2="42" stroke="#cc0000" stroke-width="3"/>
  <text x="800" y="33" fill="#cc0000" font-size="13" font-weight="bold">Ext. 5V</text>

  <!-- ==================== -->
  <!-- GND BUS              -->
  <!-- ==================== -->
  <line x1="120" y1="380" x2="580" y2="380" stroke="black" stroke-width="2.5"/>

  <!-- GND symbol -->
  <line x1="370" y1="380" x2="370" y2="398" stroke="black" stroke-width="2"/>
  <line x1="348" y1="398" x2="392" y2="398" stroke="black" stroke-width="2.5"/>
  <line x1="355" y1="406" x2="385" y2="406" stroke="black" stroke-width="2"/>
  <line x1="362" y1="414" x2="378" y2="414" stroke="black" stroke-width="2"/>
  <text x="290" y="440" font-weight="bold" fill="#333">GND = Pin 5 + Ext. 5V Minus</text>
</svg>
